<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/urna-eleitoral-brasil.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Tema inicial antes da pintura (evita flash): salvo > sistema
      try {
        var t = localStorage.getItem('eleicoes2026-tema');
        if (t === 'escuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <title>Eleições 2026 · Dashboard de Candidatos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
